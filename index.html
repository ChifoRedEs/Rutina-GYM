<!doctype html>
<html lang="es">
<head>

<body>
<div id="app">
  <header class="topbar">
    <button id="backBtn" type="button" class="icon-btn hidden" aria-label="Volver">‹</button>
    <div class="title-wrap"><h1 id="pageTitle">Rutina Gym</h1><p id="pageSubtitle"></p></div>
  </header>
  <main id="screen"></main>
  <div id="restBar" class="rest-bar" role="timer" aria-label="Temporizador de descanso"></div>
  <nav class="bottom-nav" aria-label="Navegación principal">
    <button type="button" data-route=""><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Inicio</button>
    <button type="button" data-route="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Historial</button>
    <button type="button" data-route="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V11M10 19V5M16 19v-6M22 19H2"/></svg>Progreso</button>
    <button type="button" data-route="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>Ajustes</button>
  </nav>
</div>

<div id="modalRoot"></div>

<script src="js/views-manage.js" defer></script>
